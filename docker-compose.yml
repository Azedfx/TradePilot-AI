services:
  db:
    image: postgres:16
    container_name: tradepilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot
      POSTGRES_DB: tradepilot
    ports:
      - '5432:5432'
    volumes:
      - tradepilot-db-data:/var/lib/postgresql/data

volumes:
  tradepilot-db-data:
