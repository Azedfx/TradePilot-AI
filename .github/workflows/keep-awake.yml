# GitHub Actions schedule is NOT reliable under ~1 hour (often delayed hours).
# Use this as a backup only. Primary keep-alive: free cron-job.org / UptimeRobot
# hitting /api/health every 5–10 minutes (see DEPLOYMENT.md).
name: Keep Render awake

on:
  schedule:
    # Hourly backup — GitHub actually runs these more consistently than */10.
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -e
          BASE="${DEMO_URL:-https://tradepilot-ai-973j.onrender.com}"
          URL="${BASE%/}/api/health"
          echo "Pinging $URL"
          # Cold start can take up to ~90s on free tier.
          for i in 1 2 3; do
            if curl -fsS -m 90 "$URL"; then
              echo
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed; retrying…"
            sleep 5
          done
          echo "All attempts failed"
          exit 1
