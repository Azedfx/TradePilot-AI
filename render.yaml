services:
  - type: web
    name: tradepilot-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm exec prisma generate && pnpm run build:api
    startCommand: pnpm exec prisma db push --accept-data-loss && pnpm run start:api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PNPM_VERSION
        value: 9
      - key: DATABASE_URL
        fromDatabase:
          name: tradepilot-db
          property: connectionString
      # Set this to the deployed web service's public URL once it exists,
      # e.g. https://tradepilot-web.onrender.com (no trailing slash).
      - key: CORS_ORIGIN
        sync: false
      # Qwen (Bitget hackathon proxy) — get an API key per the S2 handbook.
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://hackathon.bitgetops.com/v1
      - key: QWEN_MODEL
        value: qwen3.8-max
      # Bitget datahub MCP server for macro/market data; optional, skills
      # fall back to direct APIs (Bitget, Yahoo Finance) if unset/unreachable.
      - key: MCP_URL
        sync: false

  - type: web
    name: tradepilot-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build:web
    startCommand: pnpm run start:web
    envVars:
      - key: NODE_VERSION
        value: 20
      # Point this at the tradepilot-api service's public URL once it
      # exists, e.g. https://tradepilot-api.onrender.com (no trailing slash).
      # Next.js proxies /api/* server-side to this URL (see next.config.mjs).
      - key: BACKEND_URL
        sync: false

databases:
  - name: tradepilot-db
    plan: free
    databaseName: tradepilot
    user: tradepilot
