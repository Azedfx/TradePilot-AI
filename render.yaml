services:
  # Single web service: Next.js on Render's $PORT, NestJS API on :3000.
  # Browser hits the root URL for the dashboard; Next rewrites /api/* to Nest.
  - type: web
    name: tradepilot-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build:render
    startCommand: pnpm run start:render
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PNPM_VERSION
        value: 9
      # Baked into Next rewrites at build time — must stay localhost for same-box Nest.
      - key: BACKEND_URL
        value: http://127.0.0.1:3000
      - key: DATABASE_URL
        fromDatabase:
          name: tradepilot-db
          property: connectionString
      # Qwen (Bitget hackathon proxy) — get an API key per the S2 handbook.
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://hackathon.bitgetops.com/v1
      - key: QWEN_MODEL
        value: qwen3.8-max
      # Bitget datahub MCP server for macro/market data; optional, skills
      # fall back to direct APIs (Bitget, Yahoo Finance) if unset/unreachable.
      - key: MCP_URL
        sync: false

databases:
  - name: tradepilot-db
    plan: free
    databaseName: tradepilot
    user: tradepilot
